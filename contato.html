<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Contato | Enzo Sagaz</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <p><strong>Essa é a minha página de contato!</strong></p>
        <p>Aqui está a aba de navegações da minha página caso queira ir para outra seção:</p>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="projeto.html">Projetos</a>
            <a href="contato.html">Contato</a>
        </nav>
        <button class="escuro" id="tema">Modo Escuro</button>
    </header>
    <main>
        <section class="card">
            <h1>Entre em contato comigo!</h1>
            <form id="formulario">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required><br><br>

                <label for="assunto">Assunto:</label><br>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="orçamento">Orçamento</option>
                    <option value="duvida">Dúvida</option>
                    <option value="Sugestão">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="outro">Outro</option>
                </select><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea><br><br>

                <button type="submit">Enviar</button>
            </form>
            <p id="resposta"></p>
        </section>
    </main>
    <footer>
        <p> Enzo Sagaz - 2026.</p>
    </footer>
     <script src="JS/script.js"></script>
     <script src="JS/contato.js"></script>
</body>

</html>
